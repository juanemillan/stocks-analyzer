name: Weekly Fundamentals Refresh

on:
  schedule:
    # Sunday, before the next US trading week.
    - cron: "0 8 * * 0"
  workflow_dispatch:

jobs:
  enrich:
    name: Refresh valuation fundamentals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Configure CockroachDB TLS
        env:
          COCKROACH_CA_CERT: ${{ secrets.COCKROACH_CA_CERT }}
        run: |
          test -n "$COCKROACH_CA_CERT" || { echo "Missing COCKROACH_CA_CERT secret" >&2; exit 1; }
          cert_path="$RUNNER_TEMP/cockroach-ca.crt"
          printf '%s' "$COCKROACH_CA_CERT" > "$cert_path"
          echo "PGSSLROOTCERT=$cert_path" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt
      - name: Refresh asset fundamentals and valuation view
        working-directory: data_pipeline
        run: python main.py --enrich
