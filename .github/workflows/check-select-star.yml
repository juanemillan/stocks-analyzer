name: Prevent SELECT * in source

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  check_select_star:
    name: Check for SELECT * in source files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if `SELECT *` appears in source
        run: |
          set -euo pipefail
          echo "Searching for occurrences of 'SELECT *' in tracked source files..."
          # Search common code and SQL files, excluding build and deps
          matches=$(git grep -I -n --exclude-dir=.next --exclude-dir=node_modules -e "SELECT[[:space:]]*\\*" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.sql' '*.ps1' || true)
          if [ -n "$matches" ]; then
            echo "ERROR: Found instances of 'SELECT *' in the repository. Replace with explicit column lists to avoid large payloads being cached."
            echo
            echo "$matches"
            exit 1
          fi
          echo "No SELECT * patterns found."
