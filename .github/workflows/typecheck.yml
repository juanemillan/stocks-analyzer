name: TypeScript type-check

on:
  push:
    branches: ["main", "master"]
    paths:
      - "dashboard/**"
      - "data_pipeline/**"
      - ".github/workflows/typecheck.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "dashboard/**"
      - "data_pipeline/**"
      - ".github/workflows/typecheck.yml"

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Type-check
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Unit tests
        working-directory: dashboard
        run: npm test

      - name: Production build
        working-directory: dashboard
        env:
          # Public build-time placeholders. Vercel supplies the real values at runtime.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build

  python-check:
    name: Python pipeline syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile pipeline
        run: python -m compileall -q data_pipeline
