name: TypeScript type-check

on:
  push:
    branches: ["main", "master"]
    paths:
      - "dashboard/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "dashboard/**"

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Type-check
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Unit tests
        working-directory: dashboard
        run: npm test

      - name: Production build
        working-directory: dashboard
        run: npm run build
