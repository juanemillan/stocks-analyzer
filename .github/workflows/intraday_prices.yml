name: Intraday Price Refresh

on:
  schedule:
    # Every 15 minutes, Mon–Fri 13:30–20:15 UTC (covers NYSE/NASDAQ market hours)
    - cron: "*/15 13-20 * * 1-5"
  workflow_dispatch:

jobs:
  intraday:
    name: Refresh intraday prices
    runs-on: ubuntu-latest
    # Increase timeout to handle occasional long-running network/data fetches
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install psycopg2-binary yfinance python-dotenv numpy pandas

      - name: Fetch intraday prices (with retries)
        working-directory: data_pipeline
        run: |
          set -euo pipefail
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Fetch attempt $attempt/$max_attempts"
            if python fetch_intraday.py; then
              echo "Fetch successful"
              break
            fi
            if [ $attempt -eq $max_attempts ]; then
              echo "All fetch attempts failed" >&2
              exit 1
            fi
            sleep_time=$((attempt * 5))
            echo "Attempt $attempt failed — retrying in ${sleep_time}s..."
            sleep $sleep_time
            attempt=$((attempt + 1))
          done
